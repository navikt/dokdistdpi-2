kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{ APP_NAME }}
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  filesFrom:
    - secret: dokdistdpi-2
      mountPath: "/var/run/secrets/nais_secrets"
  envFrom:
    - secret: slack-alerts
    - secret: dokdistdpi-2
  env:
    - name: JAVA_TRUSTSTORE_OPTIONS
      value: "-Djavax.net.ssl.trustStore=$(NAV_TRUSTSTORE_PATH)
              -Djavax.net.ssl.trustStorePassword=$(NAV_TRUSTSTORE_PASSWORD)"
    - name: JDK_JAVA_OPTIONS
      value: "-Djavax.net.ssl.keyStore=$(NAV_TRUSTSTORE_PATH)
              -Djavax.net.ssl.keyStorePassword=$(NAV_TRUSTSTORE_PASSWORD)
              -Djavax.net.ssl.keyStoreType=jks
              -XX:MaxRAMPercentage=75
              -XX:MaxHeapFreeRatio=55
              -Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true
              $(JAVA_PROXY_OPTIONS) $(JAVA_TRUSTSTORE_OPTIONS)"
    - name: AZURE_APP_TOKEN_URL
      value: {{AZURE_APP_TOKEN_URL}}
    - name: DOKDISTDPI_PROXY_HOST
      value: {{DOKDISTDPI_PROXY_HOST}}
    - name: DOKDISTDPI_PROXY_PORT
      value: "{{DOKDISTDPI_PROXY_PORT}}"
    - name: DPI_URL
      value: {{ DPI_URL }}
    - name: DPI_MPCKANAL
      value: {{ DPI_MPCKANAL }}
    - name : DOKDISTDPI_ENDPOINTS_JURIDISKLOGG
      value: {{ DOKDISTDPI_ENDPOINTS_JURIDISKLOGG }}
    - name : DOKDISTDPI_ENDPOINTS_DOKDISTADMIN_SCOPE
      value: {{ DOKDISTDPI_ENDPOINTS_DOKDISTADMIN_SCOPE }}
    - name : DOKDISTDPI_ENDPOINTS_DOKDISTADMIN_URL
      value: {{ DOKDISTDPI_ENDPOINTS_DOKDISTADMIN_URL }}
    - name : DOKDISTDPI_ENDPOINTS_SAF_SCOPE
      value: {{ DOKDISTDPI_ENDPOINTS_SAF_SCOPE }}
    - name : DOKDISTDPI_ENDPOINTS_SAF_URL
      value: {{ DOKDISTDPI_ENDPOINTS_SAF_URL }}
    - name : DOKDISTDPI_ENDPOINTS_DIGDIR_SCOPE
      value: {{ DOKDISTDPI_ENDPOINTS_DIGDIR_SCOPE }}
    - name : DOKDISTDPI_ENDPOINTS_DIGDIR_URL
      value: {{ DOKDISTDPI_ENDPOINTS_DIGDIR_URL }}
    - name: DOKDISTDPI_ENDPOINTS_DOKMET_URL
      value: {{ DOKDISTDPI_ENDPOINTS_DOKMET_URL }}
    - name: MQGATEWAY01_CHANNEL_SECURENAME
      value: {{ MQGATEWAY01_CHANNEL_SECURENAME }}
    - name: MQGATEWAY01_HOSTNAME
      value: {{ MQGATEWAY01_HOSTNAME }}
    - name: MQGATEWAY01_PORT
      value: "{{ MQGATEWAY01_PORT }}"
    - name: MQGATEWAY01_NAME
      value: {{ MQGATEWAY01_NAME }}
    - name: DOKDISTDPI_QDIST011_DIST_TIL_DPI_QUEUENAME
      value: {{ DOKDISTDPI_QDIST011_DIST_TIL_DPI_QUEUENAME}}
    - name: DOKDISTDPI_QDIST011_FUNK_FEIL_QUEUENAME
      value: {{ DOKDISTDPI_QDIST011_FUNK_FEIL_QUEUENAME }}
    - name: DOKDISTDPI_QDIST014_KVITTERING_FRA_DPI_QUEUENAME
      value: {{ DOKDISTDPI_QDIST014_KVITTERING_FRA_DPI_QUEUENAME }}
    - name: DOKDISTDPI_QDIST014_FUNK_FEIL_QUEUENAME
      value: {{ DOKDISTDPI_QDIST014_FUNK_FEIL_QUEUENAME }}
    - name: DOKDISTDPI_QDIST011_DIST_TIL_DPI_KBQ_QUEUENAME
      value: {{ DOKDISTDPI_QDIST011_DIST_TIL_DPI_KBQ_QUEUENAME }}
    - name: DOKDISTSENTRALPRINT_QDIST009_DIST_S_PRINT_QUEUENAME
      value: {{ DOKDISTSENTRALPRINT_QDIST009_DIST_S_PRINT_QUEUENAME }}
    - name: NAV_VIRKSOMHETSSERTIFIKAT_CREDENTIALS
      value: {{ NAV_VIRKSOMHETSSERTIFIKAT_CREDENTIALS }}
    - name: NAV_VIRKSOMHETSSERTIFIKAT_KEY
      value: {{ NAV_VIRKSOMHETSSERTIFIKAT_KEY }}
    - name: DOKDISTMELLOMLAGER_PROJECTID
      value: {{ DOKDISTMELLOMLAGER_PROJECTID }}
    - name: DOKDISTMELLOMLAGER_BUCKET
      value: {{ DOKDISTMELLOMLAGER_BUCKET }}
    - name: DOKDISTMELLOMLAGER_KEYRING
      value: {{ DOKDISTMELLOMLAGER_KEYRING }}
    - name: DOKDISTMELLOMLAGER_KEYID
      value: {{ DOKDISTMELLOMLAGER_KEYID }}
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "deployment.environment.name={{ ENVIRONMENT }}"
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: "/var/run/secrets/nais_secrets/gcloud_serviceaccount.json"
  image: {{ image }}
  ingresses:
    {{#each INGRESSES}}
       - {{this }}
      {{/each}}
  liveness:
    path: /actuator/health/liveness
    port: 8080
    initialDelay: 30
    failureThreshold: 10
  port: 8080
  webproxy: true
  leaderElection: true
  prometheus:
    enabled: true
    path: /actuator/prometheus
  readiness:
    path: /actuator/health/readiness
    port: 8080
    initialDelay: 30
    timeout: 3
  replicas:
    min: {{ MIN_REPLICAS }}
    max: {{ MAX_REPLICAS }}
    cpuThresholdPercentage: 50
  resources:
    limits:
      memory: 4Gi
    requests:
      memory: 1500Mi
      cpu: 20m
  maskinporten:
    enabled: true
    scopes:
      consumes:
        - name: digitalpostinnbygger:send
  vault:
    enabled: true
    paths:
      - kvPath: {{ NAV_VIRKSOMHETSSERTIFIKAT_VAULT }}
        mountPath: "/secrets/virksomhetssertifikat"
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
      destinations:
        - id: "elastic-apm"
    logging:
      destinations:
        - id: elastic
        - id: loki
  azure:
    application:
      enabled: true