spring.main.banner-mode=off
server.shutdown=graceful
# actuators
management.endpoints.web.exposure.include=prometheus,health
# actuator - health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.include=camelHealth
# actuator - metrics
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.enable.http.client.requests=false
# app
dokdistdpi.endpoints.dpi.pagesize=500
kjernetidStart=07:00:00
kjernetidSlutt=23:00:00
dokdistdpi.qdist014.concurrency=4
dokdistdpi.slack.minimum-antall-sekunder-mellom-slackvarsel=3600
spring.http.codecs.max-in-memory-size=20MB

# circuitbreaker
resilience4j.circuitbreaker.configs.default.record-exceptions=no.nav.dokdistdpi.exception.technical.AbstractDokdistdpiTechnicalException
resilience4j.circuitbreaker.configs.default.ignore-exceptions=no.nav.dokdistdpi.exception.functional.AbstractDokdistdpiFunctionalException
resilience4j.circuitbreaker.instances.dpi.base-config=default

# retry
resilience4j.retry.configs.default.retry-exceptions=no.nav.dokdistdpi.exception.technical.AbstractDokdistdpiTechnicalException
resilience4j.retry.configs.default.ignore-exceptions=no.nav.dokdistdpi.exception.functional.AbstractDokdistdpiFunctionalException
resilience4j.retry.instances.dpi.base-config=default

# Slack
dokdistdpi.slack.token=${SLACK_TOKEN}
dokdistdpi.slack.channel=${SLACK_CHANNEL}
dokdistdpi.slack.enabled=${SLACK_ALERTS_ENABLED}